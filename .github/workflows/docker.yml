name: Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Compute the canonical build tag once so both per-arch legs and the
  # merge step tag with the SAME string. metadata-action's {{date}}
  # would otherwise drift by up to a minute across parallel matrix legs
  # and the umbrella subchart appVersion would point at a tag that
  # doesn't exist.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
    steps:
      - name: Compute build tag
        id: tag
        # Format mirrors constructorfabric/insight's build-images.yml
        # exactly so that `sort -V` over mixed subchart appVersions on
        # the umbrella side stays consistent.
        #
        # Branch builds (insight#1994) append `.<sanitized-branch>` after the
        # sha so a branch image can never be mistaken for a main release tag —
        # main keeps the suffix-less format, and dispatch-umbrella (which pins
        # the subchart appVersion) stays main-only.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BUILD_TAG="$(date -u +%Y.%m.%d.%H.%M)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            # Fail fast on branch names outside the docker-tag charset (+ `/`):
            # byte-wise sanitization would mangle unicode names into ambiguous,
            # potentially colliding tags. Ask to rename the branch.
            if ! printf '%s' "$REF_NAME" | LC_ALL=C grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::branch name '$REF_NAME' contains characters outside [A-Za-z0-9._/-] — non-ASCII branch names are not allowed for image builds; rename the branch"
              exit 1
            fi
            # Docker tag charset is [A-Za-z0-9._-] (branch names carry `/`);
            # cap the suffix well under the 128-char tag limit and trim
            # separator runs the sanitizer may produce at the edges.
            SAFE_BRANCH="$(printf '%s' "$REF_NAME" \
              | tr -c 'a-zA-Z0-9._-' '-' \
              | sed -E 's/^[-.]+//; s/[-.]+$//' \
              | cut -c1-60)"
            # All-separator names (e.g. `-`) pass the allowlist but sanitize
            # to nothing — a bare trailing `.` is not a usable tag suffix.
            if [ -z "$SAFE_BRANCH" ]; then
              echo "::error::branch name '$REF_NAME' sanitizes to an empty tag suffix — rename the branch"
              exit 1
            fi
            BUILD_TAG="${BUILD_TAG}.${SAFE_BRANCH}"
          fi
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "Build tag for this run: ${BUILD_TAG}"

  # Per-arch builds run in parallel on native runners (amd64 on
  # ubuntu-latest, arm64 on ubuntu-24.04-arm). Each leg pushes by
  # digest only — the tagged multi-arch manifest is assembled by the
  # merge job below once both legs finish. This avoids QEMU emulation
  # entirely: `pnpm install`, `pnpm build`, and the nginx base image
  # all resolve to native binaries on each runner.
  build-and-push:
    name: Build & Push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # push-by-digest=true emits one untagged manifest per arch into
          # GHCR; the merge job below joins them into the final tagged
          # multi-arch manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scope cache per arch so amd64 and arm64 don't evict each other.
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest from the per-arch digests at the
  # canonical <build_tag>+latest tags. `dispatch-umbrella` then pins the
  # subchart appVersion to <build_tag> and that tag must resolve to a
  # multi-arch image for both amd64 and arm64 cluster nodes.
  merge:
    name: Merge multi-arch manifest
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Forward build_tag so dispatch-umbrella has a single upstream to
      # read from (the merge that actually produced the tagged manifest).
      build_tag: ${{ needs.prepare.outputs.build_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Matches constructorfabric/insight's backend scheme. The date-based
          # tag already embeds the sha, so a separate short-sha tag is
          # redundant. The build tag applies on every run — the only triggers
          # are a main push and workflow_dispatch, and a branch dispatch is a
          # deliberate branch image build (insight#1994; the branch-suffixed
          # tag comes from `prepare`). `latest` stays default-branch-only —
          # a branch build must never move it.
          tags: |
            type=raw,value=${{ needs.prepare.outputs.build_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Copy-pastable pushed ref on the run's Summary page (insight#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  # ─── Image CVE scan ────────────────────────────────────────────────────────
  # Scans the manifest that was just pushed — the only place where base-image
  # (nginx:1.27-alpine) and OS-package CVEs are visible. The repo-level pass
  # (trivy.yml) sees the lock file and Dockerfile, never the shipped layers.
  #
  # Report-only for now (`--exit-code 0`): findings go to "Security -> Code
  # scanning" and the job log, and promotion proceeds. To bar a vulnerable
  # image from promotion — the policy target — set `--exit-code 1` here and add
  # `trivy-image` to `dispatch-umbrella`'s `needs`.
  #
  # Scoped to main: the promotion path this gate is meant to guard. Branch
  # dispatches now push a tagged `.<branch>` image too (insight#1994) but never
  # reach the umbrella, so they are left unscanned to keep dispatch cheap —
  # drop the `github.ref` half of the condition below to cover them as well.
  trivy-image:
    name: Trivy image scan (report-only)
    needs: merge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout (.trivyignore waivers)
      packages: read # pull the image under scan from GHCR
      security-events: write # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Trivy image scan (CRITICAL/HIGH)
        # Pulls from the registry directly, so no docker daemon is needed. CRITICAL/HIGH only:
        # everything here comes from the base layer and the remedy is the same at any severity.
        # `trivy convert` renders both the table and the SARIF from one scan.
        # Keep `-w /work` so a repo-root `.trivyignore` is resolved.
        env:
          TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.build_tag }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # One pull and one analysis: `trivy convert` renders both the log table and the SARIF
        # from a single JSON report instead of scanning twice. `-w /work` so a repo-root
        # `.trivyignore` is resolved — Trivy reads the default ignore file relative to the
        # working directory, and without this the file is looked for in the image's own cwd
        # and silently ignored. `--ignorefile` is not used instead: Trivy exits FATAL when the
        # named file is absent, which would break every run until someone adds a waiver.
        run: |
          set -euo pipefail
          echo "Scanning ${IMAGE_REF}"
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -v /tmp/trivy-cache:/root/.cache \
            -w /work \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
              --severity CRITICAL,HIGH \
              --pkg-types os,library \
              --ignore-unfixed \
              --exit-code 0 \
              --no-progress \
              --format json --output /work/trivy-image.json \
              "$IMAGE_REF"
          docker run --rm -v "${{ github.workspace }}:/work" \
            "$TRIVY_IMAGE" convert --format table /work/trivy-image.json
          docker run --rm -v "${{ github.workspace }}:/work" \
            "$TRIVY_IMAGE" convert --format sarif --output /work/trivy-image.sarif /work/trivy-image.json

      - name: Upload SARIF to GitHub Code Scanning
        # Guard: a failed pull must not also report a missing SARIF.
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@fb0994ef1c058010acf1efccff928b0a83b1ed54 # v4.32.6
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─── Umbrella chart dispatch ───────────────────────────────────────────────
  # After a successful main-branch image build, trigger the umbrella chart
  # workflow in constructorfabric/insight so it bumps the frontend subchart
  # appVersion to the just-published tag and cuts a new umbrella chart
  # release. PR builds and non-main dispatches don't promote (no image
  # was pushed in those cases either — metadata-action's
  # enable={{is_default_branch}} guards image tags).
  #
  # Auth: mints a short-lived installation token from the
  # `insight-chart-release-bot` GitHub App, scoped to the umbrella repo.
  # The App is installed on constructorfabric/insight-front (this repo)
  # and on constructorfabric/insight, with Actions: read & write on the
  # umbrella repo. We use the App over a PAT so dispatches aren't tied
  # to a single human.
  dispatch-umbrella:
    name: Dispatch umbrella chart publish
    needs: merge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Mint chart-release App token (scoped to umbrella repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.AUTOMATION_INSIGHT_UMBRELLA_REPO }}

      - name: Dispatch umbrella build-images workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FRONTEND_TAG: ${{ needs.merge.outputs.build_tag }}
        run: |
          set -euo pipefail
          echo "Dispatching umbrella build-images.yml with frontend_tag=${FRONTEND_TAG}"
          gh workflow run build-images.yml \
            --repo constructorfabric/insight \
            --ref main \
            -f frontend_tag="${FRONTEND_TAG}"
