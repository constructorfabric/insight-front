name: Semgrep SAST

# SAST (#231). `--config auto`; secrets are excluded here — trufflehog.yml owns them.
#
#   sast   — full tree, report-only, owns the SARIF upload.
#   second pass — `--error --baseline-commit`, BLOCKING on findings the PR introduces. Plain
#                 `--error` would fail on the existing baseline instead.

on:
  pull_request:
    branches: [main]
  push:
    # A main-branch baseline the moment something lands, rather than only at 03:27 the next
    # morning: without this, `branch:main` in Code Scanning carries no SAST data between a merge
    # and the nightly run, and a merge that introduces a finding is invisible until then.
    branches: [main]
  schedule:
    # Nightly full-tree baseline (independent of what any PR touched), 03:27 UTC.
    - cron: "27 3 * * *"
  workflow_dispatch:

# A new push obsoletes any run still in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `--baseline-commit` builds a worktree at the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Semgrep scan (full tree — feeds Code Scanning, never blocks)
        # `docker run` rather than a `container:` job so the JS actions keep the runner's Node.
        # `--config auto` needs metrics on to select rules, so `--metrics off` is omitted.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d \
            semgrep scan \
              --config auto \
              --exclude-rule generic.secrets.security.detected-generic-secret \
              --sarif --output semgrep.sarif

      - name: Semgrep scan — findings added by this pull request (BLOCKING)
        # Scoped to the PR's own findings; uploads no SARIF, which would mark the baseline fixed.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e BASE_SHA \
            semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d \
            semgrep scan \
              --config auto \
              --exclude-rule generic.secrets.security.detected-generic-secret \
              --error \
              --baseline-commit "$BASE_SHA"

      - name: Summarize findings in the job summary
        if: always()
        run: |
          [ -f semgrep.sarif ] || exit 0
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          # On PRs the analysis is attributed to the PR, not the branch.
          CS_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/security/code-scanning"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            CS_URL="${CS_BASE}?query=is%3Aopen+pr%3A${GITHUB_REF_NAME%/merge}"
          else
            CS_URL="${CS_BASE}?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}"
          fi
          python3 - semgrep.sarif "$GITHUB_STEP_SUMMARY" "$CS_URL" <<'PY'
          import json, sys, collections
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          out = open(sys.argv[2], "a", encoding="utf-8")
          cs_url = sys.argv[3]
          res = [x for r in d.get("runs", []) for x in r.get("results", [])]
          total = len(res)
          sev = collections.Counter((x.get("level") or "warning") for x in res)
          rules = collections.Counter(x.get("ruleId", "?").split(".")[-1] for x in res)
          w = out.write
          w("## Semgrep SAST (report-only)\n\n")
          w(f"**{total}** finding(s) from `auto` (secrets excluded — TruffleHog owns those). "
            f"This check does **not** block; full details in [Security -> Code scanning]({cs_url}).\n\n")
          if total:
              w("| Severity | Count |\n|---|---:|\n")
              for s in ("error", "warning", "note"):
                  if sev.get(s):
                      w(f"| {s} | {sev[s]} |\n")
              w("\n<details><summary>Findings by rule</summary>\n\n| Count | Rule |\n|---:|---|\n")
              for rid, n in rules.most_common():
                  w(f"| {n} | `{rid}` |\n")
              w("\n</details>\n")
          w("\n_Report-only: becomes blocking when `--error` is added and the baseline is clean._\n")
          PY

      - name: Upload SARIF to GitHub Code Scanning
        # Fork PRs get a read-only token and cannot upload.
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: semgrep.sarif
          category: semgrep
