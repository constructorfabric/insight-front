name: TruffleHog Secrets

# Secret detection (#231). BLOCKING — the history baseline is empty.
#
#   secrets      — pull requests and pushes: full history of the ref under test.
#   secrets-api  — nightly, GitHub API: orphaned objects, PR and issue comments, wikis.
#
# Do not change without reading why:
#   - `--results=verified,unknown,unverified,filtered_unverified` — the default hides findings
#     whose verification failed, which on a public repository is still a leak.
#   - keep the API pass unauthenticated — `GITHUB_TOKEN` gets 403 on `GET /user`.
#   - raw values never reach a log, summary or artifact — this repository is public.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly sweep over every branch, 03:13 UTC (ahead of the Semgrep baseline at 03:27).
    - cron: "13 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the tip: a secret deleted in a later commit is still a leak.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch (nightly / manual sweep)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The sweep adds every other live branch; `persist-credentials: false` leaves no credential.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: TruffleHog scan (git history)
        # stdout holds raw values and stays on the runner; only stderr reaches the log.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            git file:///src \
              --json \
              --no-update \
              --results=verified,unknown,unverified,filtered_unverified \
            > trufflehog-findings.jsonl

      - name: Summarize (redacted) and fail on any finding
        if: always()
        # Prints detector, commit and path only — never the value.
        run: |
          [ -f trufflehog-findings.jsonl ] || exit 0
          python3 - trufflehog-findings.jsonl "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'PY'
          import json, sys, collections
          rows, unparsable, skipped = [], 0, 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      d = json.loads(line)
                  except json.JSONDecodeError:
                      # A truncated or non-JSON line must not take the whole summary down with
                      # it; it is counted and reported instead.
                      unparsable += 1
                      continue
                  if "DetectorName" not in d:
                      # Only findings carry a detector. Anything else on stdout is not a finding
                      # and must not inflate the count.
                      skipped += 1
                      continue
                  git = (d.get("SourceMetadata") or {}).get("Data", {}).get("Git", {})
                  rows.append({
                      "detector": d.get("DetectorName", "?"),
                      "verified": bool(d.get("Verified")),
                      "commit": (git.get("commit") or "")[:8],
                      "file": git.get("file") or "?",
                      "line": git.get("line") or "",
                  })
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          w("## TruffleHog secret scan\n\n")
          if unparsable or skipped:
              w(f"_{unparsable} unparsable line(s), {skipped} non-finding record(s) skipped._\n\n")
          if not rows:
              w("No secrets detected in the scanned history (all result kinds enabled).\n")
              sys.exit(0)
          ver = sum(1 for r in rows if r["verified"])
          w(f"**{len(rows)}** finding(s) — {ver} live-verified, {len(rows) - ver} unverified. "
            "Values are redacted here on purpose; read them from the source commit.\n\n")
          w("| Detector | Verified | Commit | Path |\n|---|---|---|---|\n")
          for r in sorted(rows, key=lambda r: (not r["verified"], r["detector"])):
              w(f"| `{r['detector']}` | {'yes' if r['verified'] else 'no'} | `{r['commit']}` | `{r['file']}`{':' + str(r['line']) if r['line'] else ''} |\n")
          by_det = collections.Counter(r["detector"] for r in rows)
          w(f"\nBy detector: {', '.join(f'{k} x{v}' for k, v in by_det.most_common())}\n")
          w("\n**Revoke and rotate every credential listed above.** Removing the commit is not "
            "remediation — assume the value is compromised the moment it was pushed.\n")
          out.close()
          sys.exit(1)
          PY

  # Covers what refs cannot reach: orphaned objects, PR and issue comments, wikis.
  # Off pull requests — it depends on API availability.
  secrets-api:
    name: secrets (GitHub API)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: TruffleHog scan (GitHub API — comments, wikis, unreachable objects)
        # Unauthenticated on purpose — see the header.
        run: |
          set -euo pipefail
          docker run --rm \
            trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            github \
              --repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --issue-comments \
              --pr-comments \
              --include-wikis \
              --json \
              --no-update \
              --results=verified,unknown,unverified,filtered_unverified \
            > trufflehog-api-findings.jsonl

      - name: Summarize (redacted) — report only
        if: always()
        run: |
          [ -f trufflehog-api-findings.jsonl ] || exit 0
          python3 - trufflehog-api-findings.jsonl "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'PY'
          import json, sys, collections
          rows, unparsable, skipped = [], 0, 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      d = json.loads(line)
                  except json.JSONDecodeError:
                      # A truncated or non-JSON line must not take the whole summary down with
                      # it; it is counted and reported instead.
                      unparsable += 1
                      continue
                  if "DetectorName" not in d:
                      # Only findings carry a detector. Anything else on stdout is not a finding
                      # and must not inflate the count.
                      skipped += 1
                      continue
                  meta = (d.get("SourceMetadata") or {}).get("Data", {})
                  # The GitHub source reports under Github for commits and comments alike.
                  loc = meta.get("Github") or meta.get("Git") or {}
                  rows.append({
                      "detector": d.get("DetectorName", "?"),
                      "verified": bool(d.get("Verified")),
                      # A comment hit carries a link instead of a path.
                      "where": loc.get("file") or loc.get("link") or "?",
                  })
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          w("## TruffleHog — GitHub API source (report-only)\n\n")
          if unparsable or skipped:
              w(f"_{unparsable} unparsable line(s), {skipped} non-finding record(s) skipped._\n\n")
          if not rows:
              w("No secrets detected in commits, pull request and issue comments, or wikis "
                "(all result kinds enabled).\n")
              sys.exit(0)
          ver = sum(1 for r in rows if r["verified"])
          w(f"**{len(rows)}** finding(s) — {ver} live-verified, {len(rows) - ver} unverified. "
            "Values are redacted; open the linked location to read them.\n\n")
          w("| Detector | Verified | Where |\n|---|---|---|\n")
          for r in sorted(rows, key=lambda r: (not r["verified"], r["detector"])):
              w(f"| `{r['detector']}` | {'yes' if r['verified'] else 'no'} | `{r['where']}` |\n")
          by_det = collections.Counter(r["detector"] for r in rows)
          w(f"\nBy detector: {', '.join(f'{k} x{v}' for k, v in by_det.most_common())}\n")
          w("\nA hit here that the git scan did not report means the value lives outside the "
            "current refs — an orphaned commit or a comment. **Rotate it; deleting the comment "
            "does not.**\n")
          out.close()
          PY
