name: Trivy SCA

# Dependency and misconfiguration scanning over the repository (#231).
#
#   critical — CRITICAL only; the one pass that also scans secrets, so its output stays in the
#              log and never reaches a SARIF upload. BLOCKING.
#   report   — every severity, dev dependencies included.
#
# Image layers are not visible here — the published manifest is scanned by
# constructorfabric/insight's trivy-images.yml.
#
# Do not change without reading why:
#   - keep `-w /src`; do not switch to `--ignorefile` — it exits FATAL when the file is absent.
#   - the report pass must not run the secret scanner: its SARIF is world-readable here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly, 03:41 UTC — after the TruffleHog sweep (03:13) and Semgrep baseline (03:27),
    # so a bad night shows up as three separate red checks rather than one pile.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Digest-pinned Trivy, same convention as semgrep.yml / trufflehog.yml.
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  gate:
    name: critical (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy fs scan — CRITICAL only (blocking)
        # Waivers: `.trivyignore` at the repo root, date-scoped — `CVE-... exp:YYYY-MM-DD # <issue>`.
        # Keep `-w /src`; `--ignorefile` exits FATAL when the file is absent.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -w /src \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,secret,misconfig \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              /src

  report:
    name: report (all severities)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy fs scan — all severities, dev deps included
        # `trivy convert` derives the SARIF instead of rescanning.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v /tmp/trivy-cache:/root/.cache \
            -w /src \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,misconfig \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --include-dev-deps \
              --exit-code 0 \
              --no-progress \
              --format json --output /src/trivy-fs.json \
              /src
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            "$TRIVY_IMAGE" convert \
              --format sarif --output /src/trivy-fs.sarif \
              /src/trivy-fs.json

      - name: Summarize findings in the job summary
        if: always()
        # Grouped by package — the unit of remediation.
        run: |
          [ -f trivy-fs.json ] || exit 0
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          CS_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/security/code-scanning"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            CS_URL="${CS_BASE}?query=is%3Aopen+pr%3A${GITHUB_REF_NAME%/merge}"
          else
            CS_URL="${CS_BASE}?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}"
          fi
          python3 - trivy-fs.json "$GITHUB_STEP_SUMMARY" "$CS_URL" <<'PY'
          import json, sys, collections
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          out = open(sys.argv[2], "a", encoding="utf-8")
          cs_url = sys.argv[3]
          w = out.write
          vulns, miscfg = [], []
          for r in d.get("Results") or []:
              vulns += r.get("Vulnerabilities") or []
              miscfg += [(r.get("Target"), m) for m in (r.get("Misconfigurations") or [])]
          w("## Trivy SCA (report-only)\n\n")
          w(f"**{len(vulns)}** vulnerabilit(ies) + **{len(miscfg)}** misconfiguration(s), every "
            f"severity, production and development dependencies. Nothing here blocks a merge. Full details in [Security -> Code scanning]({cs_url}).\n\n")
          if vulns:
              sev = collections.Counter(v["Severity"] for v in vulns)
              w("| Severity | Count |\n|---|---:|\n")
              for s in ("CRITICAL", "HIGH", "MEDIUM", "LOW"):
                  if sev.get(s):
                      w(f"| {s} | {sev[s]} |\n")
              # One row per (package, version): that is what an upgrade actually fixes.
              bundles = collections.defaultdict(list)
              for v in vulns:
                  bundles[(v["PkgName"], v.get("InstalledVersion", "?"))].append(v)
              rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
              w("\n<details><summary>By package</summary>\n\n| Package | Max | CVEs | Fixed in |\n|---|---|---:|---|\n")
              for (pkg, ver), items in sorted(
                      bundles.items(), key=lambda kv: (min(rank.get(i["Severity"], 4) for i in kv[1]), kv[0])):
                  worst = min(items, key=lambda i: rank.get(i["Severity"], 4))["Severity"]
                  fixes = sorted({i.get("FixedVersion") or "-" for i in items})
                  w(f"| `{pkg}@{ver}` | {worst} | {len(items)} | {', '.join(fixes)} |\n")
              w("\n</details>\n")
          if miscfg:
              w("\n<details><summary>Misconfigurations</summary>\n\n| Severity | ID | Target | Title |\n|---|---|---|---|\n")
              for target, m in miscfg:
                  w(f"| {m['Severity']} | `{m['ID']}` | `{target}` | {m.get('Title', '')} |\n")
              w("\n</details>\n")
          PY

      - name: Upload SARIF to GitHub Code Scanning
        # Fork PRs get a read-only token and cannot upload.
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
